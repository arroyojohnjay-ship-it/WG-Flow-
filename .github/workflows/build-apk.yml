
name: Build WG Flow Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/arroyojohnjay/wgflow
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          if [ -d images ]; then
            cp -r images app/src/main/assets/
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WGFlow"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.arroyojohnjay.wgflow'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.arroyojohnjay.wgflow'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="WG Flow"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name="com.arroyojohnjay.wgflow.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/arroyojohnjay/wgflow/MainActivity.java <<'EOF'
          package com.arroyojohnjay.wgflow;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/wgflow.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'TempPass123!' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'TempPass123!' }}" \
            -alias wgflow \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=WG Flow, OU=Student, O=WG Flow, L=Moises Padilla, ST=Negros Occidental, C=PH"

      - name: Sign APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/wgflow.jks" \
            --ks-key-alias wgflow \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD || 'TempPass123!' }}" \
            --key-pass pass:"${{ secrets.KEYSTORE_PASSWORD || 'TempPass123!' }}" \
            --out WG-Flow.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify WG-Flow.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WG-Flow-Android-APK
          path: WG-Flow.apk
          retention-days: 14
          
